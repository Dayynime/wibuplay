name: Release Wibuplay (signed)

on:
  push:
    tags: [ 'v*' ]          # contoh: git tag v1.0.1 && git push origin v1.0.1
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Versi (format x.y.z, contoh 1.0.1)'
        required: true
        default: '1.0.0'
      publish:
        description: 'Buat GitHub Release + upload APK?'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Tentukan versi
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$INPUT_VERSION"
          fi
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Versi '$V' tidak valid. Pakai format x.y.z (contoh 1.0.1)"
            exit 1
          fi
          IFS=. read -r MA MI PA <<< "$V"
          CODE=$(( MA * 10000 + MI * 100 + PA ))
          echo "APP_VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "Versi $V (versionCode $CODE)"

      - name: Pastikan secret keystore ada
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 STORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret $v belum diisi (Settings > Secrets and variables > Actions)"
              exit 1
            fi
          done

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}   # opsional, default "upload"
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verifikasi tanda tangan
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          SIGNER=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/* | sort -V | tail -1)/apksigner
          if [ ! -x "$SIGNER" ]; then
            echo "::warning::apksigner tidak ditemukan, verifikasi dilewati"
            exit 0
          fi
          "$SIGNER" verify --print-certs "$APK" | tee "$RUNNER_TEMP/certs.txt"
          if grep -qi "CN=Android Debug" "$RUNNER_TEMP/certs.txt"; then
            echo "::error::APK rilis ditandatangani debug key. Dibatalkan."
            exit 1
          fi

      - name: Siapkan file rilis
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/Wibuplay-v${APP_VERSION_NAME}.apk"
          (cd dist && sha256sum "Wibuplay-v${APP_VERSION_NAME}.apk" | tee "Wibuplay-v${APP_VERSION_NAME}.apk.sha256")
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wibuplay-release-v${{ env.APP_VERSION_NAME }}
          path: dist/*
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}
          name: Wibuplay v${{ env.APP_VERSION_NAME }}
          generate_release_notes: true
          files: dist/*
