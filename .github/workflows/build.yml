name: Build Wibuplay APK (debug + perf)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Push baru ke branch yang sama membatalkan build lama yang masih jalan.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # versionCode naik otomatis tiap build (dibaca app/build.gradle.kts)
      APP_VERSION_CODE: ${{ github.run_number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Wibuplay-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Build Perf APK (R8 + shrink, buat tes performa)
        run: gradle assemblePerf --no-daemon --stacktrace

      - name: Upload Perf APK
        uses: actions/upload-artifact@v4
        with:
          name: Wibuplay-perf
          path: app/build/outputs/apk/perf/*.apk
          retention-days: 7

      - name: Ringkasan ukuran APK
        if: always()
        run: |
          {
            echo "### APK hasil build #${{ github.run_number }}"
            echo '```'
            ls -lh app/build/outputs/apk/*/*.apk 2>/dev/null || echo "tidak ada APK"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
